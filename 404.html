<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance</title>
<script>
  // GitHub Pages serves this for any unknown path. The app routes on the hash,
  // so send everything back to the shell and let the router take it from there.
  location.replace(location.pathname.replace(/\/[^\/]*$/, "/") + "#/");
</script>
</head>
<body style="background:#fff"></body>
</html>
