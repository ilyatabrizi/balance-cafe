<style>
  /* Holds a plain white field until the shell mounts, so the first frame is
     the brand rather than a flash of unstyled list. */
  #boot{
    position:fixed;inset:0;z-index:300;background:#fff;
    display:grid;place-items:center;
    transition:opacity .45s ease,visibility .45s;
  }
  #boot i{
    display:block;width:34px;height:34px;border-radius:50%;
    border:1.5px solid #eee;border-top-color:#000;
    animation:bootspin .9s linear infinite;
  }
  @keyframes bootspin{to{transform:rotate(360deg)}}
  html.booted #boot{opacity:0;visibility:hidden}
  @media (prefers-reduced-motion:reduce){ #boot i{animation:none} }
</style>
</head>
<body>

<div id="boot" aria-hidden="true"><i></i></div>

<div id="shell">
  <main id="view"></main>
</div>
